<script>

function updateResearchMap(){

    const selected =
        document.getElementById("subjectFilter").value;

    const traces = [];

    subjects.forEach((subject,index)=>{

        if(
            selected !== "all" &&
            selected !== subject
        ){
            return;
        }

        const x = [];
        const y = [];
        const text = [];

        for(let i=0;i<90;i++){

            const angle =
                (i/90)*Math.PI*2;

            const radius =
                0.5 +
                ((i*13 + index*7)%100)/100;

            const centerX =
                Math.cos(index*0.63)*4;

            const centerY =
                Math.sin(index*0.63)*4;

            x.push(
                centerX +
                Math.cos(angle)*radius +
                ((i*17)%100)/100
            );

            y.push(
                centerY +
                Math.sin(angle)*radius +
                ((i*23)%100)/100
            );

            text.push(

                "<b>🌸 Research Publication</b>" +

                "<br>Subject: " +
                subject +

                "<br>Feature Vector: 768-D" +

                "<br>PCA Dimension: 2D"

            );

        }


        /* =====================================================
           FLOWER SHAPE
           ใช้ Scatter Marker รูปดาว 5 กลีบแทนวงกลม
        ===================================================== */

        traces.push({

            x:x,

            y:y,

            text:text,

            mode:"markers",

            type:"scatter",

            name:subject,

            marker:{

                symbol:"star",

                size:14,

                color:
                    floralColors[index],

                opacity:.85,

                line:{

                    color:"#ffffff",

                    width:1.5

                }

            },

            hovertemplate:

                "%{text}" +

                "<extra></extra>"

        });

    });


    Plotly.newPlot(

        "researchMap",

        traces,

        {

            ...commonLayout,

            title:{

                text:
                    "🌸 768-D Feature Vectors → PCA 2D",

                font:{

                    size:19,

                    color:"#674d70"

                }

            },

            xaxis:{

                title:"Principal Component 1",

                zeroline:false,

                gridcolor:"#f2e5ed"

            },

            yaxis:{

                title:"Principal Component 2",

                zeroline:false,

                gridcolor:"#f2e5ed"

            },

            hovermode:"closest",

            legend:{

                orientation:"h",

                y:-0.15

            }

        },

        {

            responsive:true

        }

    );

}

</script>
